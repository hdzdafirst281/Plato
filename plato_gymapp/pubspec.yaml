name: plato_gymapp
description: "Ứng dụng quản lý tập luyện và dinh dưỡng cho người dùng."
publish_to: 'none'
version: 1.1.1+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  floor: ^1.5.0
  sqflite: ^2.4.2
  supabase_flutter: ^2.12.2
  uuid: ^4.5.3
  shared_preferences: ^2.5.5
  freezed_annotation: ^2.4.1   
  json_annotation: ^4.9.0
  intl: ^0.20.2
  workmanager: ^0.9.0+3
  google_fonts: ^8.0.2
  go_router: ^17.2.0
  path_drawing: ^1.0.1
  url_launcher: ^6.3.2
  collection: ^1.19.1
  image_picker: ^1.2.1
  image_cropper: ^12.2.1
  flutter_animate: ^4.5.2
  vibration: ^3.1.8
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  video_player: ^2.11.1
  font_awesome_flutter: ^11.0.0
  lottie: ^3.3.3
  flutter_background_service: ^5.1.0
  flutter_dotenv: ^6.0.1
  permission_handler: ^12.0.1
  material_symbols_icons: ^4.2928.1
  showcaseview: ^5.0.2
  just_audio: ^0.10.5
  audio_session: ^0.2.3
  responsive_framework: ^1.5.1
  system_clock: ^3.0.0
  flutter_svg: ^2.3.0
  shimmer: ^3.0.0
  fl_chart: ^1.2.0
  slang_flutter: ^3.32.0
  flutter_localizations:
    sdk: flutter
  device_info_plus: ^13.2.0
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  floor_generator: ^1.5.0
  freezed: ^2.4.1             
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  rename_app: ^1.6.6
  slang: ^3.32.0

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/logo_plato.png" 
  adaptive_icon_background: "#121212"       
  adaptive_icon_foreground: "assets/logo/logo_plato.png"

flutter_native_splash:
  # --- Cấu hình cho Light Mode ---
  color: "#FFFFFF" 
  image: "assets/logo/logo_transparent_light.png" # Logo dùng cho nền trắng

  # --- Cấu hình cho Dark Mode ---
  color_dark: "#121212" # Màu nền tối của app bạn (VD: xám đen)
  image_dark: "assets/logo/logo_transparent_dark.png" # Logo dùng cho nền tối (VD: chữ P đổi thành màu sáng hơn)

  # --- Cấu hình riêng cho Android 12+ (BẮT BUỘC) ---
  android_12:
    color: "#FFFFFF"
    image: "assets/logo/logo_transparent_light.png"
    
    color_dark: "#121212"
    image_dark: "assets/logo/logo_transparent_dark.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/init_data.sql
    - assets/logo/
    - assets/gifs/
    - assets/svg/
    - assets/svg/muscles/
    - assets/exercises/
    - assets/badges/
    - assets/videos/
    - assets/lottie/
    - assets/sounds/