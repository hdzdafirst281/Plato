name: Plato Docs CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plato-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check --requirement tools/requirements.txt

      - name: Test documentation tools
        run: python -m unittest discover --start-directory tools/tests --pattern "test_*.py"

      - name: Validate Use Case sources
        run: python tools/validate_usecases.py --strict

      - name: Verify generated Use Case document
        run: python tools/build_usecase_doc.py --check

      - name: Report Use Case impact
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python tools/check_usecase_impact.py --base "$BASE_SHA" --github-summary --fail-on-unclassified

