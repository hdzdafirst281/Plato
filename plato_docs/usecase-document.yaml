glossary:
- term: Giáo án (Program)
  definition: Một chương trình tập gồm nhiều Lịch tập.
- term: Lịch tập (Routine)
  definition: Một mẫu buổi tập gồm danh sách bài tập và các hiệp.
- term: Hiệp (Set)
  definition: Một lượt thực hiện bài tập với dữ liệu cần ghi nhận.
- term: Nhóm hiệp liên hoàn (Superset)
  definition: Hai hoặc nhiều bài được thực hiện liên tiếp theo nhóm.
- term: Năng lượng (Calories)
  definition: Năng lượng nạp vào hoặc mục tiêu dinh dưỡng, tính bằng kcal.
- term: Tỉ lệ dinh dưỡng đa lượng (Macro)
  definition: Protein, carbohydrate và chất béo.
- term: Chuỗi tập luyện (Streak)
  definition: Số ngày hoặc tuần tập liên tiếp theo quy tắc của hệ thống.
- term: Điểm kinh nghiệm (XP)
  definition: Điểm ghi nhận tiến độ hoạt động.
- term: Điểm hạng (RP) và Hạng (Rank)
  definition: Điểm và cấp bậc trong hành trình xếp hạng.
- term: Dữ liệu cục bộ (Local)
  definition: Dữ liệu được lưu trên thiết bị.
- term: Dữ liệu đám mây (Cloud)
  definition: Dữ liệu được lưu hoặc đồng bộ qua dịch vụ trực tuyến.
usecases:
  UC01:
    summary: 'Thực hiện onboarding: nhập thông tin cá nhân, mục tiêu tập luyện và dinh dưỡng, chấn thương,
      dị ứng và chế độ ăn. Người dùng đồng ý Điều khoản/EULA; hệ thống tính BMR, TDEE, calories/macro,
      dùng kế hoạch cân bằng mặc định, lưu các hạn chế ăn uống để sàng lọc thực phẩm và tự động lưu Program phù hợp.'
    importance: Cao
    type: essential
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: Màn hình khởi động tự động mở màn hình thiết lập ban đầu khi chưa có dấu hoàn tất.
      association: Người dùng – cung cấp và xác nhận thông tin thiết lập ban đầu.
      include: Khám phá và lưu chương trình tập (UC11) – hệ thống lưu các Routine của chương trình được
        đề xuất trước khi lưu hồ sơ.
      extend: Xem video hướng dẫn và thông tin hỗ trợ (UC29) – tại bước xác nhận cuối, người dùng có thể
        mở Điều khoản sử dụng hoặc EULA để xem trước khi đồng ý.
  UC02:
    summary: Kiểm tra kết nối và email đã đăng ký, gửi OTP, xác thực và đăng nhập. Hệ thống khôi phục hoặc
      hợp nhất dữ liệu cloud được hỗ trợ, gồm hồ sơ với avatar/tùy chọn đơn vị, gamification, lịch sử tập,
      Routine và cấu hình dinh dưỡng; không gồm nhật ký bữa ăn/nước theo ngày, lịch đã lên và dữ liệu tùy chỉnh chỉ lưu local.
    importance: Cao
    type: essential
    supporting_actor: Supabase – kiểm tra sự tồn tại của tài khoản, tiếp nhận yêu cầu gửi Email OTP, xác
      thực người dùng và cung cấp dữ liệu tài khoản trực tuyến.
    offstage_actor: Không có
    relationships:
      entry_point: '1. Nút “Đã có tài khoản? Đăng nhập ngay” trong Khởi tạo hồ sơ và thiết lập ban đầu
        (UC01).

        2. Thẻ Đăng nhập trên màn hình quản lý tài khoản của hồ sơ chưa liên kết.

        3. Điểm điều hướng trực tiếp đến màn hình đăng nhập của ứng dụng.'
      association: '1. Người dùng – nhập email và mã xác nhận.

        2. Supabase – kiểm tra tài khoản, tiếp nhận yêu cầu Email OTP, xác thực và cung cấp dữ liệu trực
        tuyến.'
      include: Không có
      extend: Không có
  UC03:
    summary: Liên kết hồ sơ local với email mới hoặc đổi email tài khoản đang đăng nhập. Hệ thống chặn
      gửi OTP khi phát hiện mất mạng, kiểm tra email chưa sử dụng, xác thực và đồng bộ hồ sơ/Routine theo phạm vi cloud hỗ trợ.
    importance: Cao
    type: essential
    supporting_actor: Supabase – kiểm tra email, tiếp nhận yêu cầu liên kết hoặc thay đổi email, xác thực
      Email OTP và tiếp nhận dữ liệu được đồng bộ.
    offstage_actor: Không có
    relationships:
      entry_point: '1. Thẻ Liên kết Email trên màn hình quản lý tài khoản của hồ sơ chưa liên kết.

        2. Thẻ Đổi Email liên kết trên màn hình quản lý tài khoản của người dùng đang đăng nhập.'
      association: '1. Người dùng – nhập email và mã xác nhận.

        2. Supabase – kiểm tra email, tiếp nhận yêu cầu liên kết hoặc thay đổi, xác thực và tiếp nhận
        dữ liệu.'
      include: Không có
      extend: Không có
  UC04:
    summary: Kiểm tra kết nối và email tài khoản đích, gửi/xác thực OTP; backup dữ liệu được hỗ trợ của
      tài khoản hiện tại, xóa dữ liệu local, đăng nhập tài khoản đích rồi khôi phục hồ sơ, Routine, lịch sử và gamification tương ứng.
    importance: Cao
    type: essential
    supporting_actor: Supabase – kiểm tra tài khoản đích, tiếp nhận yêu cầu Email OTP, xác thực, tiếp
      nhận dữ liệu của tài khoản hiện tại và cung cấp dữ liệu tài khoản đích.
    offstage_actor: Không có
    relationships:
      entry_point: Thẻ Chuyển đổi tài khoản khác trên màn hình quản lý tài khoản của người dùng đang đăng
        nhập.
      association: '1. Người dùng – cung cấp email tài khoản đích và mã xác nhận.

        2. Supabase – kiểm tra tài khoản, xác thực, tiếp nhận dữ liệu tài khoản hiện tại và cung cấp dữ
        liệu tài khoản đích.'
      include: Không có
      extend: Không có
  UC05:
    summary: Yêu cầu xác nhận; backup dữ liệu được cloud hỗ trợ; xóa hồ sơ và toàn bộ dữ liệu cá nhân
      local như lịch sử tập, routine, lịch đã lên, nutrition, reward ledger, custom exercise và ghi chú
      bài tập; đăng xuất Supabase và đưa ứng dụng về trạng thái chưa liên kết. Dữ liệu master của hệ thống
      vẫn được giữ lại.
    importance: Cao
    type: essential
    supporting_actor: Supabase – tiếp nhận các yêu cầu lưu hoặc cập nhật những nhóm dữ liệu được hỗ trợ
      và yêu cầu kết thúc phiên tài khoản.
    offstage_actor: Không có
    relationships:
      entry_point: Màn hình cài đặt → mục Đăng xuất, chỉ hiển thị khi có phiên tài khoản đang hoạt động.
      association: '1. Người dùng.

        2. Supabase – tiếp nhận các yêu cầu lưu hoặc cập nhật những nhóm dữ liệu được hỗ trợ và yêu cầu
        kết thúc phiên tài khoản.'
      include: Không có
      extend: Không có
  UC06:
    summary: Người dùng xác nhận yêu cầu xóa bằng email hiện tại hoặc chuỗi “DELETE”. Với tài khoản đã
      liên kết, hệ thống xóa tài khoản và dữ liệu đám mây (cloud) trước khi dọn dữ liệu cá nhân cục bộ
      (local) và kết thúc phiên. Với hồ sơ khách, hệ thống chỉ dọn dữ liệu cá nhân cục bộ. Khi thành công,
      ứng dụng đặt lại trạng thái lần chạy đầu và đưa người dùng về onboarding để khởi tạo hồ sơ mới.
      Lựa chọn chạy nền, trạng thái đã hỏi quyền và các quyền của hệ điều hành được giữ lại trên thiết
      bị.
    importance: Cao
    type: essential
    supporting_actor: Supabase – tiếp nhận yêu cầu xóa tài khoản và dữ liệu trực tuyến đối với phiên đã
      liên kết, đồng thời tiếp nhận yêu cầu kết thúc phiên.
    offstage_actor: Không có
    relationships:
      entry_point: Cá nhân → biểu tượng bánh răng → Cài đặt Ứng dụng → Quản lý tài khoản → Xóa tài khoản.
      association: '1. Người dùng.

        2. Supabase – xóa tài khoản và dữ liệu cloud đối với tài khoản đã liên kết.'
      include: Đăng xuất tài khoản (UC05) – kết thúc phiên sau khi xóa dữ liệu.
      extend: Khởi tạo hồ sơ và thiết lập ban đầu (UC01) – được mở lại sau khi xóa thành công.
  UC07:
    summary: Cập nhật thông tin cá nhân, thể trạng, số đo và cấu hình tập/dinh dưỡng. Với tài khoản liên
      kết, ảnh đại diện được tải lên Supabase Storage bucket avatars, URL công khai được lưu trong hồ sơ và đồng bộ để dùng ở leaderboard.
    importance: Trung Bình
    type: essential
    supporting_actor: '1. Thư viện ảnh trên thiết bị – cung cấp ảnh để người dùng chọn làm ảnh đại diện.

      2. Supabase – tiếp nhận yêu cầu cập nhật các thông tin hồ sơ được hỗ trợ khi người dùng có phiên
      tài khoản đã liên kết.'
    offstage_actor: Không có
    relationships:
      entry_point: '1. Màn hình hồ sơ → chạm vào ảnh đại diện.

        2. Màn hình hồ sơ → nút Chỉnh sửa.'
      association: '1. Người dùng.

        2. Thư viện ảnh trên thiết bị.

        3. Supabase – tiếp nhận yêu cầu cập nhật các trường hồ sơ được hỗ trợ khi tài khoản đã liên kết.'
      include: Không có
      extend: Không có
  UC08:
    summary: Cập nhật cân nặng hiện tại và ghi nhận lịch sử cân; thiết lập cân nặng mục tiêu, thời hạn
      và tốc độ thay đổi cân nặng; xem lộ trình cân nặng; quản lý calories và protein/carbs/fat mục tiêu;
      chuyển giữa macro tự động và macro tùy chỉnh; nhận, bỏ qua hoặc tắt nhắc cân hằng tuần; xử lý khi
      đạt hoặc hết hạn mục tiêu bằng cách duy trì cân nặng hoặc thiết lập mục tiêu mới.
    importance: Cao
    type: essential
    supporting_actor: Supabase – tiếp nhận yêu cầu đồng bộ hồ sơ khi người dùng đã đăng nhập và lưu thay
      đổi từ màn hình chỉnh sửa hồ sơ.
    offstage_actor: Không có
    relationships:
      entry_point: Tab Dinh dưỡng; thẻ mục tiêu Calories và macro; thẻ Lộ trình Cân nặng; nút Cập nhật
        Cân nặng; biểu tượng chỉnh sửa mục tiêu; màn hình Chỉnh sửa hồ sơ thuộc Quản lý hồ sơ cá nhân
        và cấu hình tập luyện (UC07); hộp thoại nhắc cân và rà soát mục tiêu do hệ thống hiển thị có điều
        kiện.
      association: '1. Người dùng.

        2. Supabase – chỉ tham gia khi đồng bộ hồ sơ của người dùng đã đăng nhập.'
      include: Không có
      extend: Không có
  UC09:
    summary: Tìm kiếm bài tập; lọc theo nhóm cơ và thiết bị; xem hình ảnh, hướng dẫn thực hiện, nhóm cơ
      chính/phụ, ghi chú cá nhân, lịch sử thực hiện và tiến độ của bài tập.
    importance: Trung Bình
    type: essential
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: '1. Hồ sơ → Bài tập.

        2. Danh sách bài tập trong chi tiết chương trình của Khám phá và lưu chương trình tập (UC11).

        3. Tên bài tập, thao tác thêm và thay thế trong Quản lý Routine (UC12).

        4. Tên bài tập, thao tác thêm và thay thế trong Thực hiện và hoàn tất buổi tập (UC15).

        5. Tên bài tập trong chi tiết buổi tập của Quản lý lịch sử tập luyện (UC17).

        6. Thẻ bài tập hoặc biểu tượng Xem chi tiết trong thư viện.'
      association: Người dùng.
      include: Không có
      extend: Không có
  UC10:
    summary: Tạo, sửa và xóa bài tập do người dùng định nghĩa; cấu hình tên, loại bài, thiết bị, nhóm
      cơ chính/phụ, hình ảnh local và ghi chú.
    importance: Trung Bình
    type: essential
    supporting_actor: Thư viện ảnh của thiết bị – cung cấp ảnh do người dùng lựa chọn.
    offstage_actor: Không có
    relationships:
      entry_point: '1. Dấu cộng trong Thư viện bài tập thuộc Tra cứu và xem thông tin bài tập (UC09).

        2. Menu Sửa hoặc Xóa tại chi tiết bài tự tạo thuộc Tra cứu và xem thông tin bài tập (UC09).'
      association: '1. Người dùng.

        2. Thư viện ảnh của thiết bị – tham gia khi người dùng chọn ảnh minh họa.'
      include: Không có
      extend: Không có
  UC11:
    summary: Xem và lọc chương trình mẫu theo mục tiêu, môi trường và độ khó; ẩn hoặc hiện chương trình
      đã thêm; xem chi tiết các routine và bài tập trong chương trình; lưu toàn bộ routine của chương
      trình vào khu vực cá nhân.
    importance: Trung Bình
    type: essential
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: '1. Nút “Khám phá” tại khu vực tập luyện.

        2. Điểm hoàn tất thiết lập ban đầu trong Khởi tạo hồ sơ và thiết lập ban đầu (UC01).'
      association: Người dùng.
      include: Không có
      extend: '1. Khởi tạo hồ sơ và thiết lập ban đầu (UC01) – Use Case hiện tại được kích hoạt có điều
        kiện tại thời điểm hoàn tất thiết lập khi hệ thống tìm được chương trình phù hợp.

        2. Tra cứu và xem thông tin bài tập (UC09) – được kích hoạt có điều kiện khi người dùng chọn một
        bài tập trong chi tiết chương trình.'
  UC12:
    summary: Xem, bắt đầu, tạo, sửa, nhân bản và xóa Routine; quản lý bài, set, mục tiêu, thời gian nghỉ,
      ghi chú, superset và Muscle Split. Tối đa 10 Routine được kiểm tra trong các luồng tạo/copy/Program;
      thay đổi lưu local trước rồi đồng bộ với bảng routines khi tài khoản và kết nối cho phép.
    importance: Cao
    type: essential
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: '1. Thẻ Routine, nút “Bắt đầu” và menu Sửa, Sao chép, Xóa tại khu vực tập luyện.

        2. Nút tạo Routine trong một thư mục thuộc Quản lý thư mục Routine (UC13).

        3. Thẻ lịch tập tương lai trong Quản lý lịch tập luyện (UC14).

        4. Menu “Lưu thành giáo án mới” trong Quản lý lịch sử tập luyện (UC17).

        5. Thao tác lưu chương trình trong Khám phá và lưu chương trình tập (UC11).

        6. Hộp thoại lưu thay đổi cấu trúc khi hoàn tất buổi tập trong Thực hiện và hoàn tất buổi tập
        (UC15).'
      association: Người dùng.
      include: Không có
      extend: '1. Tra cứu và xem thông tin bài tập (UC09) – được mở có điều kiện khi người dùng thêm,
        thay thế hoặc xem chi tiết một bài tập trong Routine.

        2. Khám phá và lưu chương trình tập (UC11) – tạo nhiều Routine có điều kiện khi người dùng lưu
        một chương trình.

        3. Quản lý thư mục Routine (UC13) – Use Case hiện tại được mở tại điểm thêm Routine vào một thư
        mục.

        4. Quản lý lịch tập luyện (UC14) – Use Case hiện tại được mở ở chế độ xem khi người dùng chọn
        một lịch tương lai còn Routine tương ứng.

        5. Thực hiện và hoàn tất buổi tập (UC15) – được kích hoạt khi người dùng bắt đầu Routine và có
        thể cập nhật lại Routine khi hoàn tất buổi tập.

        6. Quản lý lịch sử tập luyện (UC17) – Use Case hiện tại được mở để tạo Routine mới từ một buổi
        tập cũ.'
  UC13:
