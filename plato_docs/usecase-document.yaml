        2. Xem hành trình Rank (UC27) – người dùng có thể mở hành trình Rank bằng cách chọn khu vực hồ
        sơ hiện tại phía trên màn hình Thành tích.'
  UC27:
    summary: Xem Rank/RP, chu kỳ 45 ngày, vùng thăng/giữ/hạ và lịch sử. Kết quả chu kỳ mới nhất chưa xem
      hiển thị dialog; mỗi set hoàn tất cho 1 RP, tối đa 40 RP/ngày, với ngưỡng theo từng Rank. Có thể nhắc
      lúc 10:00 D-3, chuyển sớm D-4/D-5 nếu ngày dự kiến quá tải thông báo.
    importance: Thấp
    type: essential
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: '1. Thẻ tiến trình Rank trên màn hình Hồ sơ thuộc Quản lý hồ sơ cá nhân và cấu hình
        tập luyện (UC07).

        2. Ảnh đại diện tại khu vực Gamification thuộc Thực hiện nhiệm vụ và nhận phần thưởng (UC25) hoặc
        Xem bảng xếp hạng XP (UC26).'
      association: Người dùng.
      include: Không có
      extend: Không có
  UC28:
    summary: Chọn theme System/Light/Dark, ngôn ngữ Việt/Anh và độc lập các đơn vị kg/lb, lít/gallon Mỹ,
      km/m, cm/in, g/oz. Theme/ngôn ngữ lưu cấp thiết bị; đơn vị nằm trong hồ sơ và được yêu cầu đồng bộ qua measurement_units.
    importance: Thấp
    type: essential
    supporting_actor: Hệ điều hành thiết bị – cung cấp chế độ giao diện và ngôn ngữ thiết bị khi hệ thống
      cần áp dụng.
    offstage_actor: Không có
    relationships:
      entry_point: Cá nhân → biểu tượng bánh răng → Cài đặt Ứng dụng.
      association: Người dùng.
      include: Không có.
      extend: Không có.
  UC29:
    summary: Từ Cài đặt Ứng dụng, xem video hướng dẫn theo các nhóm Tập luyện (Workout), Nhật ký Tập luyện
      (Log Workout), Dinh dưỡng (Nutrition) và Lịch trình (Calendar); mở Điều khoản sử dụng, EULA, thông
      tin phiên bản; soạn email hỗ trợ hoặc mở các kênh mạng xã hội của Plato.
    importance: Thấp
    type: essential
    supporting_actor: Ứng dụng email bên ngoài – tiếp nhận yêu cầu soạn thư hỗ trợ từ ứng dụng.
    offstage_actor: Zenithas – đơn vị được nêu trong Điều khoản, EULA và thông tin hỗ trợ.
    relationships:
      entry_point: '1. Cá nhân → biểu tượng bánh răng → Cài đặt Ứng dụng.

        2. Các liên kết Điều khoản sử dụng và EULA trong Khởi tạo hồ sơ và thiết lập ban đầu (UC01).'
      association: '1. Người dùng.

        2. Ứng dụng email, trình duyệt hoặc ứng dụng mạng xã hội bên ngoài.'
      include: Không có.
      extend: UC01 – cho phép xem nội dung pháp lý trước khi đồng ý.
  UC30:
    summary: Xem hướng dẫn tương tác theo ngữ cảnh tại Tập luyện (Workout), Dinh dưỡng (Nutrition), Lịch
      tập luyện (Calendar), Thư viện Bài tập (Exercise Library) và màn hình ghi nhận buổi tập. Các hướng
      dẫn tự động chỉ xuất hiện khi chưa được đánh dấu đã xem; hướng dẫn riêng của bộ đếm giờ cardio có
      thể xuất hiện lại khi người dùng tương tác với bộ đếm.
    importance: Thấp
    type: temporal
    supporting_actor: Không có
    offstage_actor: Không có
    relationships:
      entry_point: '1. Tập luyện (Workout).

        2. Dinh dưỡng (Nutrition).

        3. Lịch trình → Lịch tập luyện (Calendar).

        4. Thư viện Bài tập (Exercise Library).

        5. Màn hình ghi nhận buổi tập và bộ đếm giờ cardio trong UC15.'
      association: Người dùng.
      include: Không có.
      extend: UC09, UC11, UC12, UC14, UC15, UC18, UC20, UC23 và UC24 – bổ sung hướng dẫn trực quan tại
        đúng ngữ cảnh.
  UC31:
    summary: Quản lý công tắc tổng/danh mục, quyền OS, thông báo nghiệp vụ và chạy nền workout. Hệ thống
      cố giữ tối đa ba, không vượt bốn thông báo OS/ngày; ưu tiên nhắc workout, có thể dời/lược bỏ tự động,
      dùng kênh không âm thanh. Lựa chọn chạy nền trong Settings được giữ nguyên và kết thúc luồng hỏi lần đầu;
      in-app notification không dùng ngân sách OS, từ chối quyền không chặn nghiệp vụ chính.
    importance: Trung bình
    type: essential
    supporting_actor: Hệ điều hành thiết bị – quản lý quyền Thông báo (Notification), quyền Hoạt động
      thể chất (Physical Activity) trên phiên bản Android áp dụng, và dịch vụ chạy nền.
    offstage_actor: Không có
    relationships:
      entry_point: '1. Cá nhân → biểu tượng bánh răng → Cài đặt Ứng dụng → Thông báo.

        2. Thao tác bắt đầu buổi tập lần đầu trong Thực hiện và hoàn tất buổi tập (UC15).

        3. Thay đổi dữ liệu lịch tập, phục hồi, nước, streak, Rank hoặc mốc không hoạt động.'
      association: '1. Người dùng.

        2. Hệ điều hành thiết bị.'
      include: Không có
      extend: Thực hiện và hoàn tất buổi tập (UC15) – bổ sung bước giải thích, kiểm tra và yêu cầu quyền
        khi người dùng bắt đầu buổi tập lần đầu.
